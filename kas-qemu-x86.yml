header:
  version: 22

# embedai 虚拟开发板（x86_64，可用 KVM 硬件加速 → 近原生速度）。
# 适合：在没有 Jetson 板子、但宿主机有 /dev/kvm 的机器上快速验证
#       「镜像能起、llama.cpp 能跑、模型能出 token」。
# 用法：  kas build kas.yml:kas-qemu-x86.yml
# 运行：  runqemu qemux86-64 nographic   （有 /dev/kvm 时自动走 KVM）
machine: qemux86-64
target:
  - embedai-qemu-image
