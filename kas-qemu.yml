header:
  version: 22

# embedai 虚拟开发板（QEMU x86_64，无 GPU/NPU）。
# 用法：  kas build kas.yml:kas-qemu.yml
# 运行：  runqemu qemux86-64 nographic   （宿主机有 /dev/kvm 时自动走 KVM，近原生速度）
# 说明：  直接使用上游标准 `qemux86-64` 机器（内核/BSP/qemuboot 开箱即用），
#         只覆盖 machine 与 target，复用 kas.yml 的全部层定义。
machine: qemux86-64
target:
  - embedai-qemu-image
