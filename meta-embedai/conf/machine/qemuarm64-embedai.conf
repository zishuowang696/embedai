#@TYPE: Machine
#@NAME: embedai QEMU ARM64 (virtual board)
#@DESCRIPTION: embedai 的虚拟开发板：沿用上游 QEMU ARM64 机器，用于无 Jetson 硬件时验证发行版（启动/systemd/网络）。
#              注意：QEMU 不提供 Jetson GPU/NPU，CUDA / TensorRT 在虚拟板上不可用。

require conf/machine/qemuarm64.conf

# 关键：让按机型名匹配的配方（如 linux-yocto 的 COMPATIBLE_MACHINE=^(...|qemuarm64|...)$）
# 把本板视为 qemuarm64，否则会出现 "Nothing PROVIDES 'virtual/kernel'"。
MACHINEOVERRIDES =. "qemuarm64:"

# 虚拟板沿用 qemuarm64 的串口/内核/启动设置；这里只做命名与说明。
# 如需调整内存/CPU：QB_MEM / QB_SMP（见 qemuarm64.conf 与 qemuboot.bbclass）。
