name: embedai-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支只保留一个 run：新 push 取消旧的，避免多个重型编译并行/缓存互相覆盖
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 快速门禁：只解析，PR/每次 push 都跑（1-3 分钟）
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compute layer cache key
        id: cache-key
        run: |
          key=$(sed -n '/^repos:/,/^bblayers_conf_header:/p' kas.yml | sha256sum | cut -d' ' -f1)
          echo "key=kas-layers-$key" >> "$GITHUB_OUTPUT"

      - name: Restore layer checkouts
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            bitbake
            oe-core
            meta-oe
            meta-tegra
            meta-tegra-community
            meta-virtualization
            tegra-demo-distro
          key: ${{ steps.cache-key.outputs.key }}

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install kas
        run: python -m pip install kas==5.3

      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chrpath diffstat python3-websockets

      - name: Expand config
        run: kas dump kas.yml

      - name: Parse all layers (bitbake -p)
        run: kas shell kas.yml -c "bitbake -p"

      - name: Save layer checkouts
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            bitbake
            oe-core
            meta-oe
            meta-tegra
            meta-tegra-community
            meta-virtualization
            tegra-demo-distro
          key: ${{ steps.cache-key.outputs.key }}

  # 完整编译：public 仓库 -> 4 核 16GB runner，靠 free-disk-space + sstate 缓存
  build:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Show disk after cleanup
        run: df -h /

      - name: Restore Yocto sstate
        uses: actions/cache/restore@v4
        with:
          path: build/sstate-cache
          key: embedai-sstate-${{ github.run_id }}
          restore-keys: |
            embedai-sstate-

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chrpath diffstat python3-websockets
          python -m pip install kas==5.3

      - name: Generate CI kas config (neutralize host paths)
        run: |
          sed -e 's|DL_DIR ?= "/home/admin/tegra/tegra-demo-distro/build/downloads"|DL_DIR ?= "${TOPDIR}/downloads"|' \
              -e 's|SSTATE_MIRRORS = "file://.\* file:///home/admin/tegra/tegra-demo-distro/build/sstate-cache/PATH"|SSTATE_MIRRORS = ""|' \
              kas.yml > kas-ci.yml
          grep -E 'DL_DIR|SSTATE_MIRRORS|SSTATE_DIR' kas-ci.yml

      - name: kas checkout (retry)
        run: |
          for i in 1 2 3; do
            if kas checkout kas-ci.yml; then
              break
            fi
            echo "kas checkout attempt $i failed, retrying in 15s"
            sleep 15
          done

      - name: Build embedai-image (resumable, 5h budget)
        run: |
          ( while true; do df -h / >> disk.log; sleep 120; done ) &
          MON_PID=$!
          set +e
          # 内部 5h 预算：到点向整个进程组发 SIGINT，让 bitbake 优雅收尾。
          # 已完成的 sstate 会保留，随后的缓存步骤存起来，下次续编。
          setsid kas build kas-ci.yml &
          BPID=$!
          ( sleep 18000; echo "5h budget reached, SIGINT to build group"; \
            kill -INT -"$BPID" 2>/dev/null; sleep 180; \
            kill -KILL -"$BPID" 2>/dev/null ) &
          WPID=$!
          wait "$BPID"; rc=$?
          kill "$WPID" "$MON_PID" 2>/dev/null || true
          set -e
          echo "kas build exit code: $rc (非 0 多为预算到点主动暂停，属预期)"
          echo "===== disk usage during build (tail) ====="
          tail -20 disk.log || true
          echo "===== final df ====="
          df -h /

      - name: Save Yocto sstate
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/sstate-cache
          key: embedai-sstate-${{ github.run_id }}

      - name: Upload image artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: embedai-image-jetson-orin-nano-devkit-nvme
          path: build/tmp/deploy/images/jetson-orin-nano-devkit-nvme/embedai-image-*
          if-no-files-found: warn
          retention-days: 30
