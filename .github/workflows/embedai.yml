name: embedai-build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'local/**'
      - 'scripts/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'kas-esdk.yml'
      - '.github/workflows/esdk.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'local/**'
      - 'scripts/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'kas-esdk.yml'
      - '.github/workflows/esdk.yml'
  workflow_dispatch:
    inputs:
      force_cancel:
        description: '先取消正在进行的构建，再重新构建'
        type: boolean
        default: false

jobs:
  # 手动强制取消：独立 job、无并发组，不被 build 队列阻塞
  cancel:
    if: github.event_name == 'workflow_dispatch' && inputs.force_cancel
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Cancel in-progress runs (except this one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow embedai-build \
                  --status in_progress --json databaseId --jq '.[].databaseId')
          for id in $ids; do
            if [ "$id" = "${GITHUB_RUN_ID}" ]; then continue; fi
            echo "cancelling run $id"
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done

  # 快速门禁：只解析（1-3 分钟）。并发组独立，可取消旧的 validate，但不影响 build
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    concurrency:
      group: embedai-validate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Compute layer cache key
        id: cache-key
        run: |
          key=$(sed -n '/^repos:/,/^bblayers_conf_header:/p' kas.yml | sha256sum | cut -d' ' -f1)
          echo "key=kas-layers-$key" >> "$GITHUB_OUTPUT"

      - name: Restore layer checkouts
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            bitbake
            oe-core
            meta-oe
            meta-tegra
            meta-tegra-community
            meta-virtualization
            tegra-demo-distro
          key: ${{ steps.cache-key.outputs.key }}

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install kas
        run: python -m pip install kas==5.3

      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chrpath diffstat python3-websockets

      - name: Expand config
        run: kas dump kas.yml

      - name: Parse all layers (bitbake -p)
        run: kas shell kas.yml -c "bitbake -p"

      - name: Save layer checkouts
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            bitbake
            oe-core
            meta-oe
            meta-tegra
            meta-tegra-community
            meta-virtualization
            tegra-demo-distro
          key: ${{ steps.cache-key.outputs.key }}

  # 完整编译：public 仓库 -> 4 核 16GB runner，靠 free-disk-space + sstate 缓存
  # 默认排队不取消（cancel-in-progress: false）：新 push 等当前构建结束再跑，不丢进度
  build:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    concurrency:
      group: embedai-build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Show disk after cleanup
        run: df -h /

      # sstate 超过 Actions cache 10GB 上限，改用 Release 持久化（无大小限制）
      - name: Restore Yocto sstate (from Release)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build
          TAG=sstate-jetson
          if gh release view "$TAG" >/dev/null 2>&1; then
            rm -rf /tmp/sst; mkdir -p /tmp/sst
            gh release download "$TAG" -D /tmp/sst -p 'LATEST' 2>/dev/null || true
            ID=$(tr -d '[:space:]' < /tmp/sst/LATEST 2>/dev/null || true)
            if [ -n "$ID" ]; then
              gh release download "$TAG" -D /tmp/sst -p "sstate-${ID}.part-*" -p "sstate-${ID}.SHA256SUMS" || true
              if ( cd /tmp/sst && sha256sum -c "sstate-${ID}.SHA256SUMS" \
                   && cat sstate-${ID}.part-* | tar -xf - -C "$GITHUB_WORKSPACE/build" ); then
                echo "sstate restored: $ID"
              fi
            else
              gh release download "$TAG" -D /tmp/sst -p 'sstate.part-*' || true
              if ls /tmp/sst/sstate.part-* >/dev/null 2>&1; then
                cat /tmp/sst/sstate.part-* | tar -xf - -C "$GITHUB_WORKSPACE/build" && echo "sstate restored (legacy)"
              fi
            fi
          else
            echo "no sstate release yet"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chrpath diffstat python3-websockets
          python -m pip install kas==5.3

      - name: Generate CI kas config (neutralize host paths)
        run: |
          sed -e 's|DL_DIR ?= "/home/admin/tegra/tegra-demo-distro/build/downloads"|DL_DIR ?= "${TOPDIR}/downloads"|' \
              -e 's|SSTATE_MIRRORS = "file://.\* file:///home/admin/tegra/tegra-demo-distro/build/sstate-cache/PATH"|SSTATE_MIRRORS = ""|' \
              kas.yml > kas-ci.yml
          grep -E 'DL_DIR|SSTATE_MIRRORS|SSTATE_DIR' kas-ci.yml

      - name: kas checkout (retry)
        run: |
          for i in 1 2 3; do
            if kas checkout kas-ci.yml; then
              break
            fi
            echo "kas checkout attempt $i failed, retrying in 15s"
            sleep 15
          done

      - name: Build embedai-image (resumable, 5.5h budget)
        run: |
          LOG="$PWD/build-run.log"
          ( while true; do df -h / >> disk.log; sleep 120; done ) &
          MON_PID=$!
          set +e
          # 内部 5.5h 预算：到点向整个进程组发 SIGINT，让 bitbake 优雅收尾。
          # 已完成的 sstate 会保留，随后的缓存步骤存起来，下次续编。
          setsid bash -c "kas build kas-ci.yml 2>&1 | tee '$LOG'" &
          BPID=$!
          ( sleep 19800; echo "5.5h budget reached, SIGINT to build group"; \
            kill -INT -"$BPID" 2>/dev/null; sleep 180; \
            kill -KILL -"$BPID" 2>/dev/null ) &
          WPID=$!
          wait "$BPID"; rc=$?
          kill "$WPID" "$MON_PID" 2>/dev/null || true
          set -e
          echo "kas build exit code: $rc"
          echo "===== final df ====="
          df -h /
          # 区分"预算到点暂停/正常结束"（非 0 也可接受）与"真实任务失败"（必须失败退出）
          if grep -qE "ERROR: Logfile of failure stored in|ERROR: Task .* failed with exit code|ERROR: Function failed" "$LOG"; then
            echo "===== REAL BUILD ERROR ====="
            grep -E "ERROR: (Task|Logfile|Function)" "$LOG" | tail -30
            exit 1
          fi
          echo "no task failures: budget pause or clean completion"

      - name: Upload image artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: embedai-image-jetson-orin-nano-devkit-nvme
          path: build/tmp/deploy/images/jetson-orin-nano-devkit-nvme/embedai-image-*
          if-no-files-found: warn
          retention-days: 30

      # 发布到 Release（永久可下；artifact 会过期）。
      # 放在"存 sstate"之前：sstate 打包很吃磁盘，万一失败也不能把镜像一起丢了。
      - name: Publish to Release (image-latest)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view image-latest >/dev/null 2>&1 || \
            gh release create image-latest \
              --title "embedai images (rolling)" \
              --notes "Rolling built images: Jetson Orin Nano (\`embedai-image\`) + QEMU aarch64 (\`embedai-qemu-image\`). Assets are replaced on each build." \
              --prerelease
          files=$(find -L build/tmp/deploy/images/jetson-orin-nano-devkit-nvme -maxdepth 1 -type f -name 'embedai-image-*')
          if [ -n "$files" ]; then
            gh release upload image-latest $files --clobber
            echo "uploaded:"; echo "$files"
          else
            echo "no image files found"
          fi

      - name: Save Yocto sstate (to Release, versioned)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d build/sstate-cache ] || { echo "no sstate-cache"; exit 0; }
          echo "===== df before freeing ====="; df -h /
          # 镜像已发布，删掉不再需要的 tmp/ 与 downloads/（DL_DIR），给分卷腾地方。
          # 否则 runner 上 tmp + downloads + sstate 会撑爆磁盘 → job 被杀（历史问题）。
          du -sh build/tmp build/downloads 2>/dev/null || true
          rm -rf build/tmp build/downloads
          echo "===== df after freeing ====="; df -h /
          TAG=sstate-jetson
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Yocto sstate cache (Jetson)" \
              --notes "Versioned sstate sets. LATEST points to the newest complete set; older sets are cleaned up. Assets are never overwritten." --prerelease
          ID="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}"
          rm -f /tmp/part-*
          tar -C build -cf - sstate-cache | split -b 1900M - /tmp/part-
          for p in /tmp/part-*; do mv "$p" "/tmp/sstate-${ID}.$(basename "$p")"; done
          ( cd /tmp && sha256sum sstate-${ID}.part-* > "sstate-${ID}.SHA256SUMS" )
          gh release upload "$TAG" /tmp/sstate-${ID}.part-* "/tmp/sstate-${ID}.SHA256SUMS"
          printf '%s\n' "$ID" > /tmp/LATEST
          gh release upload "$TAG" /tmp/LATEST --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
            [ "$name" = "LATEST" ] && continue
            case "$name" in
              sstate.part-*|SHA256SUMS) gh release delete-asset "$TAG" "$name" -y >/dev/null 2>&1 || true; continue;;
            esac
            aid="${name#sstate-}"; aid="${aid%%.*}"
            [ "$aid" = "$ID" ] && continue
            if [[ "$aid" < "$ID" ]]; then gh release delete-asset "$TAG" "$name" -y >/dev/null 2>&1 || true; fi
          done
          echo "sstate set $ID uploaded: $(ls /tmp/sstate-${ID}.part-* | wc -l) parts"
