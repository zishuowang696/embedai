name: qemu-smoke

# 虚拟开发板：构建 qemuarm64 精简镜像并做一次启动冒烟（无需 Jetson 硬件）。
# 用 GitHub runner 的网络（不受墙影响）构建，验证发行版在 aarch64 虚拟板上能起来。
on:
  workflow_dispatch:
  push:
    paths:
      - 'kas-qemu.yml'
      - 'meta-embedai/conf/machine/**'
      - 'meta-embedai/recipes-core/images/embedai-qemu-image.bb'
      - '.github/workflows/qemu-smoke.yml'
  pull_request:
    paths:
      - 'kas-qemu.yml'
      - 'meta-embedai/conf/machine/**'
      - 'meta-embedai/recipes-core/images/embedai-qemu-image.bb'

permissions:
  contents: write

jobs:
  build-and-boot:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    concurrency:
      group: qemu-smoke-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Show disk
        run: df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chrpath diffstat python3-websockets qemu-system-arm
          python -m pip install kas==5.3

      - name: Generate CI kas config (neutralize host paths)
        run: |
          sed -e 's|DL_DIR ?= "/home/admin/tegra/tegra-demo-distro/build/downloads"|DL_DIR ?= "${TOPDIR}/downloads"|' \
              -e 's|SSTATE_MIRRORS = "file://.\* file:///home/admin/tegra/tegra-demo-distro/build/sstate-cache/PATH"|SSTATE_MIRRORS = ""|' \
              kas.yml > kas-ci.yml
          grep -E 'DL_DIR|SSTATE_MIRRORS' kas-ci.yml

      # sstate 用 Release 持久化（无 10GB 限制）；真机 sstate 的 native/host 任务可共享
      - name: Restore sstate (from Release)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build
          for TAG in sstate-jetson sstate-qemu; do
            gh release view "$TAG" >/dev/null 2>&1 || continue
            rm -rf /tmp/sst; mkdir -p /tmp/sst
            gh release download "$TAG" -D /tmp/sst -p 'LATEST' 2>/dev/null || true
            ID=$(tr -d '[:space:]' < /tmp/sst/LATEST 2>/dev/null || true)
            if [ -n "$ID" ]; then
              gh release download "$TAG" -D /tmp/sst -p "sstate-${ID}.part-*" -p "sstate-${ID}.SHA256SUMS" || true
              if ( cd /tmp/sst && sha256sum -c "sstate-${ID}.SHA256SUMS" \
                   && cat sstate-${ID}.part-* | tar -xf - -C "$GITHUB_WORKSPACE/build" ); then
                echo "restored $TAG ($ID)"
              fi
            else
              gh release download "$TAG" -D /tmp/sst -p 'sstate.part-*' || true
              if ls /tmp/sst/sstate.part-* >/dev/null 2>&1; then
                cat /tmp/sst/sstate.part-* | tar -xf - -C "$GITHUB_WORKSPACE/build" && echo "restored $TAG (legacy)"
              fi
            fi
          done

      - name: kas checkout
        run: kas checkout kas-ci.yml:kas-qemu.yml

      - name: Build embedai-qemu-image (aarch64, resumable 5.5h budget)
        run: |
          LOG="$PWD/build-run.log"
          ( while true; do df -h / >> disk.log; sleep 120; done ) &
          MON_PID=$!
          set +e
          # 内部 5.5h 预算：到点 SIGINT 让 bitbake 优雅收尾，已完成 sstate 保留，下次续编。
          setsid bash -c "kas build kas-ci.yml:kas-qemu.yml 2>&1 | tee '$LOG'" &
          BPID=$!
          ( sleep 19800; echo "5.5h budget reached, SIGINT to build group"; \
            kill -INT -"$BPID" 2>/dev/null; sleep 180; \
            kill -KILL -"$BPID" 2>/dev/null ) &
          WPID=$!
          wait "$BPID"; rc=$?
          kill "$WPID" "$MON_PID" 2>/dev/null || true
          set -e
          echo "kas build exit code: $rc"
          echo "===== final df ====="
          df -h /
          # 区分"预算到点暂停/正常结束"（非 0 也可接受）与"真实任务失败"（必须失败退出）
          if grep -qE "ERROR: Logfile of failure stored in|ERROR: Task .* failed with exit code|ERROR: Function failed" "$LOG"; then
            echo "===== REAL BUILD ERROR ====="
            grep -E "ERROR: (Task|Logfile|Function)" "$LOG" | tail -30
            exit 1
          fi
          echo "no task failures: budget pause or clean completion"

      - name: Upload image artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: embedai-qemu-image-aarch64
          path: build/tmp/deploy/images/qemuarm64/embedai-qemu-image-*
          if-no-files-found: warn
          retention-days: 14

      # 发布到 Release（永久可下；artifact 会过期）——放在启动冒烟之前
      - name: Publish to Release (image-latest)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view image-latest >/dev/null 2>&1 || \
            gh release create image-latest \
              --title "embedai images (rolling)" \
              --notes "Rolling built images: Jetson Orin Nano (\`embedai-image\`) + QEMU aarch64 (\`embedai-qemu-image\`). Assets are replaced on each build." \
              --prerelease
          files=$(find -L build/tmp/deploy/images/qemuarm64 -maxdepth 1 -type f -name 'embedai-qemu-image-*')
          if [ -n "$files" ]; then
            gh release upload image-latest $files --clobber
            echo "uploaded:"; echo "$files"
          else
            echo "no qemu image files found"
          fi

      - name: Boot smoke test (runqemu, timeboxed)
        run: |
          if ! ls build/tmp/deploy/images/qemuarm64/embedai-qemu-image-* >/dev/null 2>&1; then
            echo "镜像尚未生成（本轮预算到点暂停），跳过启动测试"
            exit 0
          fi
          set +e
          timeout 1500 kas shell kas-ci.yml:kas-qemu.yml -c "runqemu qemuarm64 nographic snapshot" > boot.log 2>&1
          echo "runqemu exit: $?"
          set -e
          echo "===== boot.log (tail) ====="
          tail -80 boot.log
          echo "==========================="
          if grep -q "LLAMA_BOOT_DEMO_END" boot.log; then
            echo "LLAMA_CPP_DEMO_OK"
            grep -B3 -A3 "EMBEDAI_OK" boot.log | tail -8 || true
          elif grep -q "LLAMA_BOOT_DEMO_NO_MODEL" boot.log; then
            echo "LLAMA_CPP_DEMO_NO_MODEL"
          else
            echo "LLAMA_CPP_DEMO_NOT_REACHED"
          fi
          if grep -qE "login:|Startup finished|systemd\[1\]: Reached" boot.log; then
            echo "QEMU_BOOT_OK"
          else
            echo "QEMU_BOOT_CHECK_FAILED"
            exit 1
          fi

      # 放在冒烟之后：存 sstate 前要删 build/tmp，而 runqemu 依赖它，必须先跑完冒烟。
      - name: Save qemu sstate (to Release, versioned)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d build/sstate-cache ] || { echo "no sstate-cache"; exit 0; }
          echo "===== df before freeing ====="; df -h /
          du -sh build/tmp build/downloads 2>/dev/null || true
          # 镜像已发布、冒烟已跑完，删掉不再需要的 tmp/ 与 downloads/ 给分卷腾地
          rm -rf build/tmp build/downloads
          echo "===== df after freeing ====="; df -h /
          TAG=sstate-qemu
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Yocto sstate cache (QEMU)" \
              --notes "Versioned sstate sets. LATEST points to the newest complete set; older sets are cleaned up. Assets are never overwritten." --prerelease
          ID="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}"
          rm -f /tmp/part-*
          tar -C build -cf - sstate-cache | split -b 1900M - /tmp/part-
          for p in /tmp/part-*; do mv "$p" "/tmp/sstate-${ID}.$(basename "$p")"; done
          ( cd /tmp && sha256sum sstate-${ID}.part-* > "sstate-${ID}.SHA256SUMS" )
          gh release upload "$TAG" /tmp/sstate-${ID}.part-* "/tmp/sstate-${ID}.SHA256SUMS"
          printf '%s\n' "$ID" > /tmp/LATEST
          gh release upload "$TAG" /tmp/LATEST --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
            [ "$name" = "LATEST" ] && continue
            case "$name" in
              sstate.part-*|SHA256SUMS) gh release delete-asset "$TAG" "$name" -y >/dev/null 2>&1 || true; continue;;
            esac
            aid="${name#sstate-}"; aid="${aid%%.*}"
            [ "$aid" = "$ID" ] && continue
            if [[ "$aid" < "$ID" ]]; then gh release delete-asset "$TAG" "$name" -y >/dev/null 2>&1 || true; fi
          done
          echo "sstate set $ID uploaded: $(ls /tmp/sstate-${ID}.part-* | wc -l) parts"
