name: kas-config-validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Compute layer cache key
        id: cache-key
        run: |
          key=$(sed -n '/^repos:/,/^bblayers_conf_header:/p' kas.yml | sha256sum | cut -d' ' -f1)
          echo "key=kas-layers-$key" >> "$GITHUB_OUTPUT"

      - name: Restore layer checkouts
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            bitbake
            oe-core
            meta-oe
            meta-tegra
            meta-tegra-community
            meta-virtualization
            tegra-demo-distro
          key: ${{ steps.cache-key.outputs.key }}

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install kas
        run: python -m pip install kas==5.3

      - name: kas checkout (retry)
        run: |
          for i in 1 2 3; do
            if kas checkout kas.yml; then
              break
            fi
            echo "kas checkout attempt $i failed, retrying in 15s"
            sleep 15
          done

      - name: Expand config
        run: kas dump kas.yml

      - name: Parse all layers (bitbake -p)
        run: kas shell kas.yml -c "bitbake -p"

      - name: Save layer checkouts
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            bitbake
            oe-core
            meta-oe
            meta-tegra
            meta-tegra-community
            meta-virtualization
            tegra-demo-distro
          key: ${{ steps.cache-key.outputs.key }}
