name: kas-config-validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install kas
        run: python -m pip install kas==5.3

      - name: Expand config
        run: kas dump kas.yml

      - name: Parse all layers (bitbake -p)
        run: kas shell kas.yml -c "bitbake -p"
